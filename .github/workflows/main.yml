name: Deploy Wardrobe to GitHub Pages

# Publishes the static site in docs/ (the Wardrobe viewer) when main changes.
on:
  push:
    branches: [main]
    paths: ["docs/**", "tools/site.mjs", "vendor/**", ".github/workflows/main.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push cancels a deploy that is still running
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # copy the pixelfx source into docs/pixelfx so the viewer can play live gear effects
      - run: node tools/site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
